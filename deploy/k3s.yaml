apiVersion: v1
kind: Namespace
metadata:
  name: kinetica-bi
---
apiVersion: v1
kind: Secret
metadata:
  name: kinetica-bi
  namespace: kinetica-bi
type: Opaque
stringData:
  AUTH_SECRET: replace-with-openssl-rand-hex-32
  SESSION_ENCRYPTION_KEY: replace-with-openssl-rand-hex-32
  KINETICA_PASSWORD: replace-with-service-account-password
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kinetica-bi-data
  namespace: kinetica-bi
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kinetica-bi
  namespace: kinetica-bi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kinetica-bi
  template:
    metadata:
      labels:
        app: kinetica-bi
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: web
          image: ghcr.io/kineticadb/kinetica-bi-web:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
        - name: server
          image: ghcr.io/kineticadb/kinetica-bi-server:latest
          ports:
            - containerPort: 4000
          env:
            - name: AUTH_MODE
              value: password
            - name: KINETICA_URL
              value: http://kinetica:9191
            - name: KINETICA_USERNAME
              value: admin
            - name: DB_PATH
              value: /data/kinetica.db
            - name: CORS_ORIGIN
              value: https://bi.example.com
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: kinetica-bi
                  key: AUTH_SECRET
            - name: SESSION_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: kinetica-bi
                  key: SESSION_ENCRYPTION_KEY
            - name: KINETICA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kinetica-bi
                  key: KINETICA_PASSWORD
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kinetica-bi-data
---
apiVersion: v1
kind: Service
metadata:
  name: kinetica-bi
  namespace: kinetica-bi
spec:
  selector:
    app: kinetica-bi
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kinetica-bi
  namespace: kinetica-bi
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
    - hosts: ["bi.example.com"]
      secretName: kinetica-bi-tls
  rules:
    - host: bi.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kinetica-bi
                port:
                  number: 80
