name: build-images

# Publishes web + server images to GHCR on a release tag.
#
# TAG FORMAT IS LOAD-BEARING: this pattern requires THREE dot-separated parts,
# and docker/metadata-action's type=semver cannot parse anything less. Tags
# v1.10 through v1.20 were two-part and therefore never triggered this workflow
# — no images were published for eleven milestones. Tag `vX.Y.0`, not `vX.Y`.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  # A release tag must not publish images from a tree that fails its own gates.
  gates:
    uses: ./.github/workflows/ci.yml

  build:
    needs: gates
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: web
            image: kinetica-bi-web
          - target: server
            image: kinetica-bi-server
    steps:
      - uses: actions/checkout@v4
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
